": "该句纯属市场回顾，未将任何业绩结果归因于自身或市场，不构成归因单元（R7）。研究员引R8，但R8要求「受益于…我们取得收益」的归因结构，本句无「我们」、无因果连接词，仅陈述指数涨幅。请求改判为 not_a_unit。", "cited_rules": ["R7", "R8"], "requested_locus": "not_a_unit", "concede": false}, "adjudicator": {"final_locus": "not_a_unit", "final_specificity": 1, "final_result_direction": "neutral", "final_escalation": false, "confidence": 0.7, "cited_rules": ["R7", "R8"], "resolution": "改判。原文仅陈述指数走势与涨幅，无「我们」主体、无因果归因结构，属纯市场回顾，不构成归因单元；R8需受益归因结构，不适用。", "human_review": false}, "is_illustration": false, "baseline": null, "agreement": "changed"}, {"uid": 2, "quote": "此外，化工下半年开始股价领先于基本面上涨，涨价逻辑从有色金属向化工、电力设备、能源矿产和材料、电子元器件、消费建材等上游环节全面扩散，这些品种有的受益于AI投资拉动需求增长、有的则是成本推动的价格上涨、还有很多品种则是长期跌价后自发的“反内卷”式串谋上涨", "researcher": {"locus": "external", "specificity": 4, "result_direction": "neutral", "escalation": false, "cited_rules": ["R8"], "argument": "该句描述化工等上游品种股价上涨，原因归于AI需求拉动、成本推动、行业反内卷等外部产业因素，非管理人决策，故为外部；列举具体行业与机制，具体性4。"}, "manager": {"rebuttal": "研究员误读了句子结构：本句是市场行情描述，主语是「化工等上游品种股价」，并非本基金业绩归因，按R7属纯操作/行情陈述，不构成归因单元。即便按R8视为外部，也与我方决策无关，不存在自我归功。", "cited_rules": ["R7", "R8"], "requested_locus": "not_a_unit", "concede": false}, "adjudicator": {"final_locus": "not_a_unit", "final_specificity": 1, "final_result_direction": "neutral", "final_escalation": false, "confidence": 0.7, "cited_rules": ["R7"], "resolution": "改判：该句为市场行情描述，主语是化工等品种股价，未归因于本基金业绩或管理人决策，属纯行情陈述，不构成归因单元。", "human_review": false}, "is_illustration": false, "baseline": null, "agreement": "changed"}, {"uid": 3, "quote": "2025年本基金的表现并不令人满意，市场的变化和较高的市场位置对我们惯常使用的希望兼顾beta与alpha的投资框架形成了较大挑战，目前市场风格具有明显的周期性波动，有时更在意长期叙事的故事性、有时更在意短期涨价的确定性，市场在信息传播过载的背景下更容易受到谣言和小作文的影响", "researcher": {"locus": "external", "specificity": 3, "result_direction": "negative", "escalation": false, "cited_rules": ["R2", "R4"], "argument": "业绩不佳归因于市场变化、高位置、风格轮动与谣言扰动，均为管理人控制之外因素；虽提及自身框架，但仅作被动承受方，原因指向外部。"}, "manager": {"rebuttal": "研究员误读了句子结构：原文「较高的市场位置对我们……投资框架形成了较大挑战」中，被挑战的对象是「我们的投资框架」，即管理人承认自身方法论不适配，属内部归因；且同段明确承认「传统的方法论越来越难以适应」，并非单方面诿过。市场描述仅为背景，非归因指向。", "cited_ru function renderOv(){

  ov.innerHTML = `
  ${D.meta.has_labels?'':`<div class="banner">标签尚未生成（等待 API key）。当前页面展示语料规模、切分结果与指标口径；「辩论实录」将在标注完成后填充。</div>`}

    <div class="kpi"><b>${D.meta.reports}</b><span>年报样本</span></div>
    <div class="kpi"><b>${D.meta.units}</b><span>归因单元</span></div>
    <div class="kpi"><b>${aai?f2(aai.diff*100)+'pp':'—'}</b><span>AAI（跑赢 − 跑输）</span></div>
    <div class="kpi"><b>${aai?`[${(aai.ci95[0]*100).toFixed(1)}, ${(aai.ci95[1]*100).toFixed(1)}]`:'—'}</b><span>95% 置信区间</span></div>
  </div>
  ${D.meta.eval && D.meta.eval.debate_k4 ? `
  <div class="card">
    <h3>主指标：模型与人类共识的一致性（kappa）</h3>
    <div class="grid k4" style="margin-top:8px">
      <div class="kpi"><b>${D.meta.eval.human_k4}</b><span>人际上限（两位受训标注员）</span></div>
      <div class="kpi"><b style="color:#6fb3ff">${D.meta.eval.debate_k4}</b><span>三角色辩论（本文方法）</span></div>
      <div class="kpi"><b style="color:#e0b050">${D.meta.eval.rule_k4}</b><span>词典规则法（对照）</span></div>
      <div class="kpi"><b style="color:#5fd08a">${D.meta.eval.retest_kappa}</b><span>重跑一致性（可复刻）</span></div>
    </div>
    <p class="muted" style="margin-top:10px">模型优于词典法，约为人际上限的 70%；同一提示词真调用重跑一致率 ${D.meta.eval.retest_po}。
    换用 deepseek-reasoner 零代码跑通（kappa ${D.meta.eval.swap_kappa}）。</p>
  </div>` : ''}
  <div class="card">
    <h3>AAI 的定义</h3>
    <p class="mono" style="font-size:13px;color:#9fd0ff">AAI = E[内部归因占比 | 跑赢组] − E[内部归因占比 | 跑输组]</p>
    <p class="muted">内部归因：把结果归于自身判断与操作；外部归因：归于市场、政策、行业等不可控因素。
    AAI &gt; 0 表示跑赢时更爱把功劳归于自己——这正是自我归因偏差。</p>
    <p class="muted">当前数值来源：<b style="color:#c9d6e4">${src}</b>。分组按 2025 年超额收益（相对业绩比较基准）中位数切分。</p>
  </div>
  <div class="card">
    <h3>为什么不用绝对收益</h3>
    <p class="muted">2025 年是 A 股大年，样本中绝对收益为正的基金占绝大多数，无法提供对照。改用「相对业绩比较基准的超额」后，
    跑赢/跑输才具备可比的对照组；这也是自我归因偏差文献的标准口径。</p>
  </div>`;
}

/* ---------- 基金画像 ---------- */
let cur=0;
function renderPf(){
  pf.innerHTML = `<div class="left">
    <div class="card" style="margin-top:0">
      <h3>样本基金（共 ${D.funds.length} 只，按组分层）</h3>
      <div id="flist"></div>
    </div>
    <div id="fdetail"></div>
  </div>`;
  const fl=document.getElementById('flist');
  D.funds.forEach((f,i)=>{
    const d=document.createElement('div');
    d.innerHTML=`<span>${f.name}</span><span class="mono ${f.excess>=0?'pos':'neg'}">${f2(f.excess)}</span>`;
    d.onclick=()=>{cur=i;mark();detail();};
    fl.appendChild(d);
  });
  function mark(){[...fl.children].forEach((c,i)=>c.classList.toggle('on',i===cur));}
  window.__mark=mark;
  mark();detail();
}
function detail(){
  const f=D.funds[cur];
  document.getElementById('fdetail').innerHTML=`
  <div class="card" style="margin-top:0">
    <h3>${f.name} <span class="chip mono">${f.code}</span> <span class="chip">${f.high?'跑赢组':'跑输组'}</span></h3>
    <table>
      <tr><th>2025 净值增长率</th><td class="mono ${f.nav>=0?'pos':'neg'}">${f2(f.nav)}%</td>
          <th>业绩比较基准</th><td class="mono">${f2(f.bench)}%</td></tr>
      <tr><th>超额收益</th><td class="mono ${f.excess>=0?'pos':'neg'}">${f2(f.excess)}pp</td>
          <th>股票仓位</th><td class="mono">${f.ratio==null?'—':f.ratio.toFixed(2)+'%'}</td></tr>
      <tr><th>持仓只数</th><td class="mono">${f.nhold||'—'}</td><th>归因单元</th><td class="mono">${f.units.length}</td></tr>
    </table>
  </div>
  <div class="card">
    <h3>切分出的归因单元</h3>
    ${f.units.map(u=>unitCard(u,false)).join('')}
  </div>`;
}
function locusPill(l){
  if(!l) return '<span class="pill p-na">未标注</span>';
  if(l==='internal') return '<span class="pill p-int">内部归因</span>';
  if(l==='external') return '<span class="pill p-ext">外部归因</span>';
  if(l==='not_a_unit') return '<span class="pill p-na">非归因单元</span>';
  return '<span class="pill p-mix">混合</span>';
}
function unitCard(u,withDebate){
  const a=u.adjudicator||{};
  const conf=a.confidence;
  const ovr=JSON.parse(localStorage.getItem('ovr_'+u.uid+'_'+cur)||'null');
  return `<div class="unit">
    <div class="q">「${u.quote}」</div>
    <div class="tags">
      ${locusPill(a.final_locus||(u.baseline&&u.baseline.locus))}
      ${(a.final_specificity||(u.baseline&&u.baseline.specificity))?`<span class="chip">具体性 ${a.final_specificity||u.baseline.specificity}</span>`:''}
      ${conf!=null?`<span class="chip">置信度 ${Number(conf).toFixed(2)}</span>`:''}
      ${ovr?`<span class="chip" style="color:#d29922">人工改判为 ${ovr}</span>`:''}
      <button class="btn ghost" onclick="override(${u.uid},'${((u.adjudicator||{}).final_locus)||u.locus||''}')">我不同意</button>
    </div>
    ${withDebate?debateBlock(u):''}
  </div>`;
}
function debateBlock(u){
  if(!u.researcher&&!u.manager&&!u.adjudicator)
    return `<div class="debate"><div class="role" style="grid-column:1/-1;color:var(--dim)">辩论实录待生成（需要 API key 运行标注）</div></div>`;
  const r=u.researcher||{},m=u.manager||{},a=u.adjudicator||{};
  const conf=a.confidence||0;
  const ban = u.is_illustration
    ? '<div class="banner" style="margin:10px 0 0">示意数据 · 用于展示三角色交互流程，非本次真实模型输出</div>'
    : '';
  return `<div class="debate">
    <div class="role"><h4>研究员 · 提出判定</h4>
      ${locusPill(r.locus)}<div class="muted" style="margin-top:6px">${r.argument||''}</div>
      <div class="muted mono" style="margin-top:4px">${(r.cited_rules||[]).join(' ')||''}</div></div>
    <div class="role"><h4>基金经理 · 辩护</h4>
      ${locusPill(m.requested_locus)}<div class="muted" style="margin-top:6px">${m.rebuttal||''}</div>
      <div class="muted mono" style="margin-top:4px">${(m.cited_rules||[]).join(' ')||''}</div></div>
    <div class="role"><h4>裁决 · 最终判定</h4>
      ${locusPill(a.final_locus)}<div class="muted" style="margin-top:6px">${a.resolution||''}</div>
      <div class="bar"><i style="width:${Math.round(conf*100)}%"></i></div>
      <div class="muted mono" style="margin-top:4px">置信度 ${Number(conf).toFixed(2)} · ${(a.cited_rules||[]).join(' ')||''}</div></div>
  </div>${ban}`;
}
function override(uid, from){
  const v=prompt('你的判定（internal / external / mixed / not_a_unit）：');
  if(!v) return;
  if(!['internal','external','mixed','not_a_unit'].includes(v)){alert('取值不合法');return;}
  const reason=prompt('推翻理由（可留空）：')||'';
  const rec={code:cur,uid:Number(uid),from:from||'',to:v,reason:reason,
             by:'ui',ts:new Date().toISOString().slice(0,19)};
  localStorage.setItem('ovr_'+cur+'_'+uid, JSON.stringify(rec));
  detail(); renderDb();
}
function exportOverrides(){
  const recs=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('ovr_')===0){try{recs.push(JSON.parse(localStorage.getItem(k)));}catch(e){}}
  }
  if(!recs.length){alert('还没有推翻记录');return;}
  const txt=recs.map(r=>JSON.stringify(r)).join('\n')+'\n';
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(txt);
  a.download='overrides.jsonl';a.click();
}

/* ---------- 辩论实录 ---------- */
function renderDb(){
  const rows=[];
  D.funds.forEach((f,fi)=>f.units.forEach(u=>{
    if(u.researcher||u.adjudicator) rows.push({f,fi,u});
  }));
  if(!rows.length){
    db.innerHTML=`<div class="banner">辩论实录为空——标注尚未运行。运行 <span class="mono">03_label.py debate</span> 后重建本页面即可看到三角色全过程。</div>
    <div class="card"><h3>将呈现什么</h3>
    <p class="muted">每个归因单元依次经过：研究员提出判定并引用条款 → 基金经理尽力辩护 → 裁决员裁决并给出置信度。
    任何判定都可被人工推翻，推翻记录进入审计日志。</p></div>`;
    return;
  }
  const head = D.meta.has_real_debate
    ? `<div class="card" style="margin-top:0"><h3>辩论实录（${rows.length} 条真实模型输出）
     <button class="btn ghost" style="float:right" onclick="exportOverrides()">导出推翻记录</button></h3>`
    : `<div class="banner">以下为<b>示意数据</b>，用于展示三角色交互流程与可审计结构，<b>不是</b>本次真实模型输出。真实辩论文本需在取得模型接口凭证后运行 <span class="mono">03_label.py debate</span> 生成。</div>
       <div class="card" style="margin-top:0"><h3>辩论实录 · 交互示意（${rows.length} 条）</h3>`;
  db.innerHTML = head +
    rows.slice(0,40).map(r=>`<div class="muted chip" style="margin-bottom:6px">${r.f.name}</div>${unitCard(r.u,true)}`).join('') +
    `</div>`;
}

        <tr><th style="width:230px">AAI（跑赢 − 跑输）</th><td class="mono">${aai.diff!=null?f2(aai.diff*100)+'pp':'—'}
           <span class="muted">95% CI [${aai.ci95?(aai.ci95[0]*100).toFixed(1):'—'}, ${aai.ci95?(aai.ci95[1]*100).toFixed(1):'—'}]</span></td></tr>
        <tr><th>组内内部归因占比</th><td class="mono">跑赢 ${a.mean_internal_share?(a.mean_internal_share.high*100).toFixed(1):'—'}% ·
           跑输 ${a.mean_internal_share?(a.mean_internal_share.low*100).toFixed(1):'—'}%</td></tr>
        <tr><th>具体性双重差分 SG</th><td class="mono">${a.SG_specificity_did!=null?a.SG_specificity_did:'—'}</td></tr>
        <tr><th>承诺升级密度差 EI</th><td class="mono">${a.EI_escalation&&a.EI_escalation.diff!=null?(a.EI_escalation.diff*100).toFixed(2)+'pp':'—'}</td></tr>
        <tr><th>回归 high_excess 系数</th><td class="mono">${a.regression&&a.regression.terms&&a.regression.terms.high_excess?
           a.regression.terms.high_excess.coef+' (t='+a.regression.terms.high_excess.t+')':'—'}</td></tr>
        <tr><th>安慰剂 95% 区间</th><td class="mono">${a.placebo?`[${(a.placebo.ci95[0]*100).toFixed(1)}, ${(a.placebo.ci95[1]*100).toFixed(1)}]pp`: '—'}</td></tr>
      </table>
    </div>`;
  }).join('');
}

renderOv();renderPf();renderDb();renderLb();
</script>
